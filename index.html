<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Scroll driven hero section animation using HTML, CSS and GSAP."
  >

  <title>Scroll Driven Hero Animation</title>

  <!-- GSAP -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
  </script>

  <!-- GSAP ScrollTrigger -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js">
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main>

    <!-- =========================================
         HERO SECTION
    ========================================== -->

    <section class="hero">

      <div class="hero-content">

        <!-- Headline -->
<h1 class="hero-title">
  <span>W</span>
  <span>E</span>
  <span>L</span>
  <span>C</span>
  <span>O</span>
  <span>M</span>
  <span>E</span>

  <span class="title-gap"></span>

  <span>I</span>
  <span>T</span>
  <span>Z</span>

  <span class="title-gap"></span>

  <span>F</span>
  <span>I</span>
  <span>Z</span>
  <span>Z</span>
</h1>


        <!-- Main Visual -->
        <div class="visual">

          <!-- Decorative Circle -->
          <div class="visual-circle"></div>

          <!-- Car -->
          <img
            src="assets/car.png"
            alt="Car"
            class="car"
          >

        </div>


        <!-- Statistics -->
        <div class="stats">

          <div class="stat">
            <h2>87%</h2>
            <p>Brand Engagement</p>
          </div>

          <div class="stat">
            <h2>72%</h2>
            <p>Customer Growth</p>
          </div>

          <div class="stat">
            <h2>94%</h2>
            <p>Digital Impact</p>
          </div>

        </div>

      </div>

    </section>


  </main>


  <script src="js/script.js"></script>

</body>
</html>
